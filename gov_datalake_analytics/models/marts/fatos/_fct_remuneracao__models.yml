version: 2

models:
  - name: fct_remuneracao
    description: "Fato sobre a remuneração dos servidores"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id_servidor_portal
              - year
              - month
    columns:
      - name: id_servidor_portal
        tests:
          - relationships:
              arguments:
                to: ref('dim_servidor')
                field: id_servidor_portal
      - name: cod_org_lotacao
        tests:
          - relationships:
              arguments:
                to: ref('dim_orgao_siape')
                field: cod_org_lotacao
      - name: cod_tipo_vinculo
        tests:
          - relationships:
              arguments:
                to: ref('dim_tipo_vinculo')
                field: cod_tipo_vinculo