version: 2

models:
  - name: fct_depro_alocacao
    description: "Fato de alocação de servidores por órgão (cedidos, quadro de pessoal, estagiários), grão orgao_codigo_siorg + year + month. Medidas agregadas via SUM devido a linhas paralelas na fonte original (SEGES/Raio-X) sem coluna discriminante, afetando ~8% da população (914 de 11.466 linhas, 385 grupos)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - orgao_codigo_siorg
              - year
              - month
    columns:
      - name: orgao_codigo_siorg
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgao_depro')
                field: orgao_codigo_siorg
      - name: ano_mes
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: ano_mes