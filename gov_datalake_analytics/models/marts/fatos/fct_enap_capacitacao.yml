version: 2

models:
  - name: fct_enap_capacitacao
    description: "Fato sobre as capacitações registradas na plataforma ENAP"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - codigo_pessoa
              - cod_curso
              - cod_turma
              - dt_matricula
    columns:
      - name: sk_matricula
        tests:
          - unique
          - not_null
      - name: codigo_pessoa
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pessoa_enap')
                field: codigo_pessoa
      - name: cod_curso
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_curso_enap')
                field: cod_curso
      - name: ano_mes
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: ano_mes
      - name: situacao_matricula
        tests:
          - accepted_values:
              arguments:
                values: ['Concluído', 'Não Aprovado', 'Evadido', 'Não Informado']
      - name: carga_horaria
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: cod_turma
        tests:
          - not_null
      - name: dt_matricula
        tests:
          - not_null