version: 2

models:
  - name: fct_vinculo_ativos
    description: "Fato sobre o vínculo dos servidores"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id_servidor_portal
              - year
              - month
              - cod_org_lotacao
              - cod_tipo_vinculo
              - matricula
              - situacao_vinculo
              - cod_uorg_exercicio
    columns:
      - name: id_servidor_portal
        tests:
          - relationships:
              arguments:
                to: ref('dim_servidor')
                field: id_servidor_portal
          - not_null
      - name: ano_mes
        tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: ano_mes
          - not_null
      - name: cod_tipo_vinculo
        tests:
          - relationships:
              arguments:
                to: ref('dim_tipo_vinculo')
                field: cod_tipo_vinculo
          - not_null
      - name: cod_org_lotacao
        tests:
          - relationships:
              arguments:
                to: ref('dim_orgao_siape')
                field: cod_org_lotacao
          - not_null
      - name: sk_vinculo
        tests:
          - unique
          - not_null