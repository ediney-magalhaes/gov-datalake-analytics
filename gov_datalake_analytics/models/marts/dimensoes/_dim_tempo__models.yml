version: 2

models:
  - name: dim_tempo
    description: "Dimensão de tempo, derivada dos 8 models de staging via UNION DISTINCT"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - month
    columns:
      - name: year
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: trimestre
        tests:
          - not_null
      - name: nome_mes
        tests:
          - not_null
      - name: ano_mes
        tests:
          - not_null