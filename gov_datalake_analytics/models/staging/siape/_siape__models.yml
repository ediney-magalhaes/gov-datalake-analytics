version: 2

models:
  - name: stg_siape__ativos
    description: "Tabela de servidores ativos da fonte SIAPE, tratada na camada staging com tipagem de datas, exclusão de dados sensíveis"
    columns:
      - name: id_servidor_portal
        description: "Identificador único do servidor, chave de linkage entre as fontes SIAPE e DEPRO"
        tests:
          - not_null
      - name: year
        description: "Ano de competência do registro, derivado da partição Hive (year=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 'extract(year from current_date())'
      - name: month
        description: "Mês de competência do registro, derivado da partição Hive (month=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: descricao_cargo
        description: "Descrição do cargo do servidor"
        tests:
          - not_null
      - name: situacao_vinculo
        description: "Descreve o vínculo do servidor"
        tests:
          - not_null
      - name: cod_org_lotacao
        description: "Traz o código do órgão onde o servidor esta lotado"
        tests:
          - not_null
      - name: cod_org_exercicio
        description: "Traz o código do órgão onde o servidor esta em exercício"
        tests:
          - not_null
      - name: tipo_vinculo
        description: "Descreve o tipo do vínculo estabelecido com o servidor"
        tests:
          - not_null
  - name: stg_siape__remuneracao
    description: "Tabela com a composição de remuneração dos servidores, tratada na camada staging com tipagem de datas, exclusão de dados sensíveis"
    columns:
      - name: id_servidor_portal
        description: "Identificador único do servidor, chave de linkage entre as fontes SIAPE e DEPRO"
        tests:
          - not_null
      - name: remuneracao_basica_bruta_reais
        description: "Valor da remuneração bruta dos servidores em reais"
        tests:
          - not_null
      - name: year
        description: "Ano de competência do registro, derivado da partição Hive (year=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 'extract(year from current_date())'
      - name: month
        description: "Mês de competência do registro, derivado da partição Hive (month=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
  - name: stg_siape__aposentados
    description: "Tabela informativa com a situação de vínculo dos servidores, tratada na camada staging com tipagem de datas, exclusão de dados sensíveis"
    columns:
      - name: id_servidor_portal
        description: "Identificador único do servidor, chave de linkage entre as fontes SIAPE e DEPRO"
        tests:
          - not_null
      - name: descricao_cargo
        description: "Traz informação sobre o cargo do servidor"
        tests:
          - not_null
      - name: cod_org_lotacao
        description: "Coluna com o código do órgão onde o servidor esta lotado"
        tests:
          - not_null
      - name: situacao_vinculo
        description: "Descreve a situação do vínculo do servidor"
        tests:
          - not_null
      - name: year
        description: "Ano de competência do registro, derivado da partição Hive (year=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 'extract(year from current_date())'
      - name: month
        description: "Mês de competência do registro, derivado da partição Hive (month=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12