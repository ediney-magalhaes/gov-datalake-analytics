version: 2

models:
  - name: stg_depro__alocacao
    description: "Tabela com registro de alocação dos servidores, tratada na camada staging com tipagem de datas, exclusão de dados sensíveis"
    columns:
      - name: orgao_codigo_siorg
        description: "Coluna com código do órgão onde o servidor é alocado, não é chave de linkage com a fonte SIAPE"
        tests:
          - not_null
      - name: quantidade_servidores_cedidos_apf
        description: "Coluna com a quantidade de servidores na categoria 'cedidos_apf' por órgão"
        tests:
          - not_null
      - name: quantidade_servidores_cedidos_outros
        description: "Coluna com a quantidade de servidores na categoria 'cedidos_outros' por órgão"
        tests:
          - not_null
      - name: quantidade_servidores_cedidos
        description: "Coluna com a quantidade de servidores cedidos por órgão"
        tests:
          - not_null
      - name: quantidade_servidores_quadro_pessoal
        description: "Coluna com a quantidade de servidores no quadro por órgão"
        tests:
          - not_null
      - name: year
        description: "Ano de competência do registro, derivado da partição Hive (year=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 'extract(year from current_date())'
      - name: month
        description: "Mês de competência do registro, derivado da partição Hive (month=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
  - name: stg_depro__cargos
    description: "Tabela com registro dos cargos e quantidade dos servidores alocados por cargos, tratada na camada staging com tipagem de datas, exclusão de dados sensíveis"
    columns:
      - name: orgao_codigo_siorg
        description: "Coluna com código do órgão onde o servidor é alocado, não é chave de linkage com a fonte SIAPE"
        tests:
          - not_null
      - name: carreira
        description: "Coluna com o tipo de carreira o servidor esta alocado"
        tests:
          - not_null
      - name: cargo
        description: "Coluna com a descrição do cargo do servidor"
        tests:
          - not_null
      - name: quantidade
        description: "Coluna com a quantidade de servidores por cargo"
        tests:
          - not_null
      - name: year
        description: "Ano de competência do registro, derivado da partição Hive (year=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 'extract(year from current_date())'
      - name: month
        description: "Mês de competência do registro, derivado da partição Hive (month=) no GCS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12