version: 2

models:
  - name: stg_siape_aposentados
    description: "Tabela de aposentados do SIAPE com dados limpos e padronizados."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
          - hash_cpf
          - mes_competencia
          - id_vinculo
    columns:
      - name: hash_cpf
        description: "CPF do servidor (identificador único)"
        tests:
          - not_null

      - name: nome_servidor
        tests:
          - not_null