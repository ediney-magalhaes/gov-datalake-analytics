version: 2

models:
  - name: "mart_servidores_remuneracao"
    description: "Tabela de remuneração dos servidores ativos"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hash_cpf
              - id_vinculo
              - mes_competencia
    columns:
      - name: hash_cpf
        description: "CPF do servidor"
        tests:
          - not_null
